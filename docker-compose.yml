# Local lakehouse: SeaweedFS (S3) + Iceberg REST catalog + Spark + Trino.
# Kafka joins in week 6; Airflow and Superset in week 7.
#
# Every service reads the same local S3 credentials from .env (S3_* vars, see
# .env.example), falling back to admin/password. Inside the containers they are
# exposed as AWS_* because that's where the AWS SDKs look for them.
#
# All ports bind to 127.0.0.1 so nothing is reachable from the network you're
# on (Jupyter has no login, and the S3 defaults are well known).

name: ercot

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-admin}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-password}
  AWS_REGION: ${S3_REGION:-us-east-1}

services:
  # Object storage. `weed server` runs SeaweedFS's master, volume, and filer in
  # one process; -s3 adds the S3 API gateway on port 8333.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: >
      server -dir=/data -s3 -s3.port=8333
      -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      <<: *s3-env
    ports:
      - "127.0.0.1:8333:8333"   # S3 API
      - "127.0.0.1:9333:9333"   # master UI
      - "127.0.0.1:8889:8888"   # filer UI (browse buckets); 8888 is taken by Jupyter
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      retries: 30

  # Iceberg REST catalog: tracks which metadata file is current for each table.
  # Spark and Trino both ask it where tables live, then read the files from S3.
  rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      <<: *s3-env
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      # Keep the catalog's own database on a volume so tables survive restarts.
      CATALOG_URI: jdbc:sqlite:/home/iceberg/iceberg_catalog.db
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - catalog-data:/home/iceberg

  spark:
    image: tabulario/spark-iceberg:3.5.5_1.8.1
    depends_on:
      - rest
    environment:
      <<: *s3-env
    ports:
      - "127.0.0.1:8888:8888"   # Jupyter
      - "127.0.0.1:4040:4040"   # Spark UI for the running application
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark:/home/iceberg/spark
    mem_limit: 5g

  trino:
    image: trinodb/trino:484
    depends_on:
      - rest
    environment:
      <<: *s3-env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    # Trino's JVM takes 80% of the memory it can see; without a limit that
    # would be most of Docker's 12GB.
    mem_limit: 3g

volumes:
  seaweedfs-data:
  catalog-data:
